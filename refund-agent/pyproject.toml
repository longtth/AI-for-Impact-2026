[project]
name = "refund-agent"
version = "0.1.0"
description = "Agent xu ly yeu cau hoan tien - vi du di kem bai 'Hello World with AGENT Development'"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "truststore>=0.9",
]

[project.scripts]
refund-agent = "refund_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refund_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "steps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "steps"]
