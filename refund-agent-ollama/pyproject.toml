[project]
name = "refund-agent-ollama"
version = "0.1.0"
description = "Agent xu ly yeu cau hoan tien chay bang Ollama (LLM local) - phien ban Ollama cua refund-agent"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
]

[project.scripts]
refund-agent-ollama = "refund_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refund_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
